openapi: 3.0.3
info:
  title: Writers' Guild API
  version: 0.1.0
  description: |
    HTTP contract of the Writers' Guild. The Go server interface and the
    TypeScript client are generated from this file. Streaming endpoints use
    Server-Sent Events and are documented here but implemented by hand.
servers:
  - url: /
security: []
paths:
  /api/auth/login:
    post:
      operationId: login
      summary: Sign in with username and password
      description: |
        Sets the session cookie (HttpOnly, SameSite=Lax; Secure over HTTPS)
        and returns the account. A wrong username is refused exactly like a
        wrong password (401, code `invalid_credentials`). After five wrong
        passwords for a username from one address, further tries are refused
        with 429 (code `too_many_attempts`) and a `Retry-After` header for a
        minute, then longer, up to a quarter of an hour. A disabled account
        cannot sign in (401, code `account_disabled`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Error" }

  /api/auth/logout:
    post:
      operationId: logout
      summary: Sign out of this browser
      responses:
        "204":
          description: The session cookie was cleared
        default: { $ref: "#/components/responses/Error" }

  /api/users:
    get:
      operationId: listUsers
      summary: Every account (admins only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createUser
      summary: Add an account (admins only); there is no sign-up form
      description: |
        The new account gets its own settings, example writers and system
        agents. Usernames are lower-case, 3 to 32 characters; a taken
        username answers 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreateInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }

  /api/users/usage:
    get:
      operationId: getUsersUsage
      summary: What every account holds and used (admins only)
      description: |
        Per account: projects and chapters held now, and runs, gateway calls,
        tokens and cost over the period (last 7, 30 or 90 days, or all time),
        with totals. Accounts and usage only, never manuscripts.
      parameters:
        - name: period
          in: query
          required: false
          schema: { type: string, enum: [7d, 30d, 90d, all], default: all }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsagePage" }
        default: { $ref: "#/components/responses/Error" }

  /api/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/userId"
    put:
      operationId: updateUser
      summary: Change an account's display name or role (admins only)
      description: |
        Nobody changes their own role (403), and one active admin always
        remains: demoting the last one answers 409. Changes are serialized,
        so two admins acting at the same moment cannot slip past the rule.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdateInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteUser
      summary: Delete a disabled account and everything it owns (admins only)
      description: |
        The account must be disabled first (409 otherwise) and the body must
        repeat its username (400 otherwise). Nobody deletes their own account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserDeleteInput" }
      responses:
        "204":
          description: Deleted
        default: { $ref: "#/components/responses/Error" }

  /api/users/{userId}/password:
    parameters:
      - $ref: "#/components/parameters/userId"
    put:
      operationId: setUserPassword
      summary: Set a new password for another account (admins only); it is signed out everywhere
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserPasswordInput" }
      responses:
        "204":
          description: Set
        default: { $ref: "#/components/responses/Error" }

  /api/users/{userId}/disable:
    parameters:
      - $ref: "#/components/parameters/userId"
    post:
      operationId: disableUser
      summary: Disable an account (admins only); it is signed out, its runs are cancelled, its work is kept
      description: Nobody disables their own account (403); the last active admin cannot be disabled (409).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }

  /api/users/{userId}/enable:
    parameters:
      - $ref: "#/components/parameters/userId"
    post:
      operationId: enableUser
      summary: Enable a disabled account again (admins only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }

  /api/account:
    put:
      operationId: updateAccount
      summary: Change the display name of the signed-in account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }

  /api/account/password:
    put:
      operationId: changePassword
      summary: Change the signed-in account's password
      description: |
        Requires the current password; the new one needs at least 8
        characters. Every other session of the account ends; this browser
        receives a fresh session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChangeInput" }
      responses:
        "204":
          description: Changed; a fresh session cookie was set
        default: { $ref: "#/components/responses/Error" }

  /api/me:
    get:
      operationId: getMe
      summary: Current account and app configuration
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Error" }

  /api/settings:
    get:
      operationId: getSettings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        default: { $ref: "#/components/responses/Error" }

  /api/gateway/models:
    get:
      operationId: listGatewayModels
      summary: Aliases known to the gateway
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GatewayModels" }
        default: { $ref: "#/components/responses/Error" }

  /api/projects:
    get:
      operationId: listProjects
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectSummary" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }

  /api/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      operationId: getProject
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProject
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /api/projects/{projectId}/chapters:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      operationId: listChapters
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChapterSummary" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createChapter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChapterCreateInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chapter" }
        default: { $ref: "#/components/responses/Error" }

  /api/projects/{projectId}/bible:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      operationId: listBibleEntries
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BibleEntry" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createBibleEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BibleEntryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BibleEntry" }
        default: { $ref: "#/components/responses/Error" }

  /api/bible-entries/{entryId}:
    parameters:
      - $ref: "#/components/parameters/entryId"
    put:
      operationId: updateBibleEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BibleEntryInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BibleEntry" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteBibleEntry
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /api/chapters/{chapterId}:
    parameters:
      - $ref: "#/components/parameters/chapterId"
    get:
      operationId: getChapter
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chapter" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateChapter
      summary: Rename or move a chapter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChapterMetaInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chapter" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteChapter
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /api/chapters/{chapterId}/content:
    parameters:
      - $ref: "#/components/parameters/chapterId"
    put:
      operationId: saveChapterContent
      summary: Save the chapter text; may create an autosave snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChapterContentInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChapterSaveResult" }
        "409":
          description: The chapter changed since base_hash was read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        default: { $ref: "#/components/responses/Error" }

  /api/chapters/{chapterId}/versions:
    parameters:
      - $ref: "#/components/parameters/chapterId"
    get:
      operationId: listChapterVersions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChapterVersionSummary" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createChapterSnapshot
      summary: Take a labelled snapshot by hand
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SnapshotInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChapterVersion" }
        default: { $ref: "#/components/responses/Error" }

  /api/chapters/{chapterId}/versions/{versionId}:
    parameters:
      - $ref: "#/components/parameters/chapterId"
      - $ref: "#/components/parameters/versionId"
    get:
      operationId: getChapterVersion
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChapterVersion" }
        default: { $ref: "#/components/responses/Error" }

  /api/chapters/{chapterId}/versions/{versionId}/restore:
    parameters:
      - $ref: "#/components/parameters/chapterId"
      - $ref: "#/components/parameters/versionId"
    post:
      operationId: restoreChapterVersion
      summary: Snapshot the current text, then replace it with the version
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chapter" }
        default: { $ref: "#/components/responses/Error" }

  /api/chapters/{chapterId}/runs:
    parameters:
      - $ref: "#/components/parameters/chapterId"
    get:
      operationId: listChapterRuns
      summary: Runs of a chapter, newest first
      parameters:
        - name: kind
          in: query
          required: false
          schema: { $ref: "#/components/schemas/RunKind" }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Error" }

  /api/chapters/{chapterId}/critiques:
    parameters:
      - $ref: "#/components/parameters/chapterId"
    post:
      operationId: startCritique
      summary: Convene the Guild on a chapter
      description: |
        Starts a critique run in the background and returns it at once. The
        chosen critics read the chapter (split into scenes above the account's
        scene token limit) in parallel; follow them through
        `GET /api/runs/{runId}/events`. Event types: `critique.plan`,
        `writer.started`, `writer.delta`, `writer.retry`, `writer.done`,
        `writer.failed`, then the editor-in-chief's `editor.started`,
        `editor.delta`, `editor.retry`, `editor.done` (with the prioritized
        list; `fallback` is true when the editor failed and the list was
        assembled from the critics' notes), then `run.finished`. The validated
        critiques are at `GET /api/runs/{runId}/critiques` and the prioritized
        list at `GET /api/runs/{runId}/issues`.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CritiqueStartInput" }
      responses:
        "202":
          description: The run that was started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Error" }

  /api/runs/{runId}/critiques:
    parameters:
      - $ref: "#/components/parameters/runId"
    get:
      operationId: listRunCritiques
      summary: The critics' validated replies for a critique run
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CritiqueRecord" }
        default: { $ref: "#/components/responses/Error" }

  /api/runs/{runId}/issues:
    parameters:
      - $ref: "#/components/parameters/runId"
    get:
      operationId: listRunIssues
      summary: The editor-in-chief's prioritized issue list for a critique run
      responses:
        "200":
          description: OK, in priority order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Issue" }
        default: { $ref: "#/components/responses/Error" }

  /api/issues/{issueId}/decision:
    parameters:
      - $ref: "#/components/parameters/issueId"
    put:
      operationId: decideIssue
      summary: Accept, reject, edit the fix of, or undo a decision on an issue
      description: |
        `accepted` with `edited_fix` set is "edit the fix": the author's wording
        replaces the suggested fix when the revision is applied. `pending`
        undoes a decision; `edited_fix` is kept unless it is sent as null or
        empty.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueDecisionInput" }
      responses:
        "200":
          description: The issue after the decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        default: { $ref: "#/components/responses/Error" }

  /api/chapters/{chapterId}/revisions:
    parameters:
      - $ref: "#/components/parameters/chapterId"
    get:
      operationId: listChapterRevisions
      summary: Revisions proposed for a chapter, newest first
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/RevisionStatus" }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Revision" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: startRevision
      summary: Ask the lead writer to apply the accepted issues of a critique run
      description: |
        Starts a revision run in the background and returns it at once. The
        lead writer receives the chapter (scene by scene above the scene
        token limit), the story bible and the accepted issues with their
        final fix wording, and returns the revised text; the app diffs it
        against the chapter into word-level hunks and stores a proposed
        revision. Events: `revision.started`, `revision.delta`,
        `revision.retry`, `revision.done` (with the revision id), then
        `run.finished`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevisionStartInput" }
      responses:
        "202":
          description: The run that was started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Error" }

  /api/revisions/{revisionId}:
    parameters:
      - $ref: "#/components/parameters/revisionId"
    get:
      operationId: getRevision
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Revision" }
        default: { $ref: "#/components/responses/Error" }

  /api/revisions/{revisionId}/apply:
    parameters:
      - $ref: "#/components/parameters/revisionId"
    post:
      operationId: applyRevision
      summary: Apply all or some hunks of a proposed revision to the chapter
      description: |
        Takes a "before revision" snapshot, replaces the chapter text with the
        chosen hunks applied, and marks the revision applied. Fails with 409
        when the chapter changed since the revision was proposed, or when the
        revision was already applied or discarded.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevisionApplyInput" }
      responses:
        "200":
          description: The chapter and the revision after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevisionApplyResult" }
        default: { $ref: "#/components/responses/Error" }

  /api/revisions/{revisionId}/discard:
    parameters:
      - $ref: "#/components/parameters/revisionId"
    post:
      operationId: discardRevision
      summary: Discard a proposed revision without touching the chapter
      responses:
        "200":
          description: The discarded revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Revision" }
        default: { $ref: "#/components/responses/Error" }

  /api/chapters/{chapterId}/bible-updates:
    parameters:
      - $ref: "#/components/parameters/chapterId"
    post:
      operationId: startBibleUpdate
      summary: Ask the bible keeper what the chapter changes in the story bible
      description: |
        Starts a bible update run in the background and returns it at once.
        It also starts by itself when a revision is applied. Events:
        `bible.started`, `bible.delta`, `bible.retry`, `bible.done` (with the
        stored proposals), then `run.finished`. Proposals wait for the
        author's decision at `GET /api/projects/{projectId}/bible/proposals`.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BibleUpdateStartInput" }
      responses:
        "202":
          description: The run that was started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Error" }

  /api/projects/{projectId}/bible/proposals:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      operationId: listProjectBibleProposals
      summary: Story bible proposals of a project, newest first
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ProposalStatus" }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BibleProposal" }
        default: { $ref: "#/components/responses/Error" }

  /api/runs/{runId}/bible-proposals:
    parameters:
      - $ref: "#/components/parameters/runId"
    get:
      operationId: listRunBibleProposals
      summary: The proposals a bible update run produced
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BibleProposal" }
        default: { $ref: "#/components/responses/Error" }

  /api/bible-proposals/{proposalId}:
    parameters:
      - $ref: "#/components/parameters/proposalId"
    put:
      operationId: decideBibleProposal
      summary: Approve (optionally edited) or reject a story bible proposal
      description: |
        `approved` applies the proposal to the story bible: an addition
        creates the entry, an update rewrites the entry's title and fields,
        a deletion removes it. `title` and `fields` in the body replace the
        proposal's own before it is applied ("edit and approve"). A proposal
        can be decided once; an update or deletion whose entry no longer
        exists fails with 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BibleProposalDecisionInput" }
      responses:
        "200":
          description: The proposal after the decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BibleProposal" }
        default: { $ref: "#/components/responses/Error" }

  /api/chapters/{chapterId}/drafts:
    parameters:
      - $ref: "#/components/parameters/chapterId"
    get:
      operationId: listChapterDrafts
      summary: Recent co-writer drafts of a chapter, newest first
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Draft" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: startCowrite
      summary: Ask one co-writer for a draft, or two or three for drafts to compare
      description: |
        Starts a co-write run (one writer) or a compare run (two or three
        writers, same request) in the background and returns it at once. With
        `selection` the writers propose text to take the passage's place;
        without it they continue from the cursor using `context_before` and
        `context_after`. Events: `draft.started`, `draft.delta`,
        `draft.retry`, `draft.done` (with the whole draft), `draft.failed`,
        then `run.finished`. Drafts are at `GET /api/runs/{runId}/drafts`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CowriteStartInput" }
      responses:
        "202":
          description: The run that was started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Error" }

  /api/runs/{runId}/drafts:
    parameters:
      - $ref: "#/components/parameters/runId"
    get:
      operationId: listRunDrafts
      summary: The drafts a co-write or compare run produced
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Draft" }
        default: { $ref: "#/components/responses/Error" }

  /api/drafts/{draftId}/decision:
    parameters:
      - $ref: "#/components/parameters/draftId"
    put:
      operationId: decideDraft
      summary: Record what the author did with a draft
      description: |
        `inserted` and `replaced` record that the text went into the chapter
        (the editor does the insertion); `discarded` sets it aside; `pending`
        takes a discarded draft back. `replaced` is only valid for a draft
        made from a selection.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftDecisionInput" }
      responses:
        "200":
          description: The draft after the decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Draft" }
        default: { $ref: "#/components/responses/Error" }

  /api/chapters/{chapterId}/history:
    parameters:
      - $ref: "#/components/parameters/chapterId"
    get:
      operationId: getChapterHistory
      summary: Every run of a chapter, newest first, with totals
      description: |
        Runs with a one-line summary each and the counts behind it (critics,
        issues and decisions, revision changes, drafts, proposals), the
        totals of runs, cost and tokens over every run matching `kind`, and
        per-kind counts for the filter. Page through with `before`.
      parameters:
        - name: kind
          in: query
          required: false
          schema: { $ref: "#/components/schemas/RunKind" }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - name: before
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoryPage" }
        default: { $ref: "#/components/responses/Error" }

  /api/runs/{runId}/calls:
    parameters:
      - $ref: "#/components/parameters/runId"
    get:
      operationId: listRunCalls
      summary: The gateway calls a run made, with cost and tokens per writer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ModelCall" }
        default: { $ref: "#/components/responses/Error" }

  /api/stats/writers:
    get:
      operationId: getWriterStats
      summary: Acceptance rates and cost per writer, by period and project
      description: |
        For every writer of the account: issues on the editor-in-chief's list
        that cite the writer (an issue counts for every critic it cites) with
        the author's decisions and the resulting acceptance rate, drafts and
        how many went into the chapter, and cost, tokens and calls per kind
        of run. `period` restricts to the last 7, 30 or 90 days; `project_id`
        to one novel (writer tests belong to no project and drop out then).
      parameters:
        - name: period
          in: query
          required: false
          schema: { type: string, enum: [7d, 30d, 90d, all], default: all }
        - name: project_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriterStatsPage" }
        default: { $ref: "#/components/responses/Error" }

  /api/runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/runId"
    get:
      operationId: getRun
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Error" }

  /api/runs/{runId}/cancel:
    parameters:
      - $ref: "#/components/parameters/runId"
    post:
      operationId: cancelRun
      summary: Stop a running run; a finished run is returned unchanged
      responses:
        "200":
          description: The run after the cancel request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        default: { $ref: "#/components/responses/Error" }

  /api/runs/{runId}/events:
    parameters:
      - $ref: "#/components/parameters/runId"
    get:
      operationId: streamRunEvents
      summary: Follow a run as Server-Sent Events
      description: |
        Replays the stored events with a sequence number above `after` (or
        the `Last-Event-ID` header), then follows the run live. Each event has
        `id` set to its sequence number, `event` set to its type and `data`
        holding the JSON payload. The stream ends after `run.finished`, or
        after an `end` event when the run was already over; the browser then
        closes the EventSource instead of reconnecting.
      parameters:
        - name: after
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: An event stream
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /api/writers:
    get:
      operationId: listWriters
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Writer" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createWriter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WriterInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Writer" }
        default: { $ref: "#/components/responses/Error" }

  /api/writers/test:
    post:
      operationId: testWriter
      summary: Send a short sample request through the gateway
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WriterTestInput" }
      responses:
        "200":
          description: The gateway answered or refused; see ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WriterTestResult" }
        default: { $ref: "#/components/responses/Error" }

  /api/writers/{writerId}:
    parameters:
      - $ref: "#/components/parameters/writerId"
    get:
      operationId: getWriter
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Writer" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: updateWriter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WriterInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Writer" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteWriter
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /api/writers/{writerId}/duplicate:
    parameters:
      - $ref: "#/components/parameters/writerId"
    post:
      operationId: duplicateWriter
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Writer" }
        default: { $ref: "#/components/responses/Error" }

components:
  parameters:
    projectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    chapterId:
      name: chapterId
      in: path
      required: true
      schema: { type: string, format: uuid }
    versionId:
      name: versionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    entryId:
      name: entryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    writerId:
      name: writerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    runId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    issueId:
      name: issueId
      in: path
      required: true
      schema: { type: string, format: uuid }
    revisionId:
      name: revisionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    proposalId:
      name: proposalId
      in: path
      required: true
      schema: { type: string, format: uuid }
    draftId:
      name: draftId
      in: path
      required: true
      schema: { type: string, format: uuid }
    userId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }

    User:
      type: object
      required: [id, username, display_name, role, created_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        disabled_at: { type: string, format: date-time, description: Set while the account is disabled }
        role: { type: string, enum: [admin, author] }
        created_at: { type: string, format: date-time }

    Me:
      type: object
      required: [user, app_name, default_model_alias, alias_prefix]
      properties:
        user: { $ref: "#/components/schemas/User" }
        app_name: { type: string }
        default_model_alias: { type: string }
        alias_prefix: { type: string }

    Settings:
      type: object
      required: [scene_token_limit, autosave_snapshot_minutes]
      properties:
        scene_token_limit: { type: integer }
        autosave_snapshot_minutes: { type: integer }

    SettingsInput:
      type: object
      required: [scene_token_limit, autosave_snapshot_minutes]
      properties:
        scene_token_limit: { type: integer, minimum: 500, maximum: 200000 }
        autosave_snapshot_minutes: { type: integer, minimum: 1, maximum: 1440 }

    GatewayModels:
      type: object
      required: [alias_prefix, aliases, all_models]
      properties:
        alias_prefix: { type: string }
        aliases:
          type: array
          description: Models whose id starts with the alias prefix
          items: { type: string }
        all_models:
          type: array
          items: { type: string }

    Project:
      type: object
      required: [id, name, description, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProjectSummary:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          required: [chapter_count]
          properties:
            chapter_count: { type: integer }

    ProjectInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }

    ChapterSummary:
      type: object
      required: [id, project_id, title, position, content_hash, content_length, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        title: { type: string }
        position: { type: integer }
        content_hash: { type: string }
        content_length: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Chapter:
      type: object
      required: [id, project_id, title, position, content_md, content_hash, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        title: { type: string }
        position: { type: integer }
        content_md: { type: string }
        content_hash: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ChapterCreateInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        content_md: { type: string }

    ChapterMetaInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        position: { type: integer }

    ChapterContentInput:
      type: object
      required: [content_md]
      properties:
        content_md: { type: string }
        base_hash:
          type: string
          description: Hash the client last loaded; when set and stale the save is refused with 409

    ChapterSaveResult:
      type: object
      required: [chapter, snapshot_created]
      properties:
        chapter: { $ref: "#/components/schemas/Chapter" }
        snapshot_created: { type: boolean }

    ChapterVersionSummary:
      type: object
      required: [id, chapter_id, kind, label, content_hash, content_length, created_at]
      properties:
        id: { type: string, format: uuid }
        chapter_id: { type: string, format: uuid }
        kind: { type: string, enum: [autosave, manual, pre_revision, pre_restore] }
        label: { type: string }
        content_hash: { type: string }
        content_length: { type: integer }
        created_at: { type: string, format: date-time }

    ChapterVersion:
      type: object
      required: [id, chapter_id, kind, label, content_md, content_hash, created_at]
      properties:
        id: { type: string, format: uuid }
        chapter_id: { type: string, format: uuid }
        kind: { type: string, enum: [autosave, manual, pre_revision, pre_restore] }
        label: { type: string }
        content_md: { type: string }
        content_hash: { type: string }
        created_at: { type: string, format: date-time }

    SnapshotInput:
      type: object
      properties:
        label: { type: string, maxLength: 200 }

    BibleSection:
      type: string
      enum: [premise, character, setting, timeline, style, chapter_summary]

    BibleEntry:
      type: object
      required: [id, project_id, section, title, fields, position, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        section: { $ref: "#/components/schemas/BibleSection" }
        title: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
        chapter_id: { type: string, format: uuid }
        position: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BibleEntryInput:
      type: object
      required: [section, title, fields]
      properties:
        section: { $ref: "#/components/schemas/BibleSection" }
        title: { type: string, maxLength: 300 }
        fields:
          type: object
          additionalProperties: { type: string }
        chapter_id: { type: string, format: uuid }
        position: { type: integer }

    WriterRole:
      type: string
      enum: [critic, co-writer]

    Writer:
      type: object
      required: [id, name, slug, model_alias, system_prompt, roles, enabled, temperature, is_system, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        model_alias: { type: string }
        system_prompt: { type: string }
        roles:
          type: array
          items: { $ref: "#/components/schemas/WriterRole" }
        enabled: { type: boolean }
        temperature: { type: number, format: double }
        is_system: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WriterInput:
      type: object
      required: [name, system_prompt, roles, enabled, temperature]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        model_alias:
          type: string
          description: Defaults to "{APP_NAME}-{slug}" when empty on create
        system_prompt: { type: string, maxLength: 20000 }
        roles:
          type: array
          items: { $ref: "#/components/schemas/WriterRole" }
        enabled: { type: boolean }
        temperature: { type: number, format: double, minimum: 0, maximum: 2 }

    WriterTestInput:
      type: object
      required: [name, model_alias, system_prompt, temperature]
      properties:
        writer_id: { type: string, format: uuid }
        name: { type: string }
        model_alias: { type: string, minLength: 1 }
        system_prompt: { type: string }
        temperature: { type: number, format: double, minimum: 0, maximum: 2 }

    WriterTestResult:
      type: object
      required: [ok, run_id, model_alias, prompt_tokens, completion_tokens, cost_known, cost_estimated, latency_ms]
      properties:
        ok: { type: boolean }
        run_id: { type: string, format: uuid }
        model_alias: { type: string }
        reply: { type: string }
        error: { type: string }
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        cost_usd: { type: number, format: double }
        cost_known: { type: boolean }
        cost_estimated: { type: boolean }
        latency_ms: { type: integer }

    RunKind:
      type: string
      enum: [critique, revision, bible_update, cowrite, compare, writer_test]

    RunStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]

    Run:
      type: object
      description: One workflow execution. params holds what started it, result what it produced.
      required: [id, kind, status, params, error, cost_usd, cost_estimated, prompt_tokens, completion_tokens, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/RunKind" }
        status: { $ref: "#/components/schemas/RunStatus" }
        project_id: { type: string, format: uuid }
        chapter_id: { type: string, format: uuid }
        params:
          type: object
          additionalProperties: true
        result:
          type: object
          additionalProperties: true
        error: { type: string }
        cost_usd: { type: number, format: double }
        cost_estimated: { type: boolean }
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }

    RunEvent:
      type: object
      description: One Server-Sent Event of a run, as stored. seq is the SSE id.
      required: [run_id, seq, type, payload, created_at]
      properties:
        run_id: { type: string, format: uuid }
        seq: { type: integer }
        type: { type: string }
        payload:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }

    CritiqueStartInput:
      type: object
      properties:
        writer_ids:
          type: array
          description: Critics to convene; omitted or empty means every enabled writer with the critic role.
          items: { type: string, format: uuid }

    IssueSeverity:
      type: string
      enum: [high, medium, low]

    CritiqueIssue:
      type: object
      required: [id, severity, quote, problem, suggested_fix, start, end, quote_exact]
      properties:
        id: { type: string }
        severity: { $ref: "#/components/schemas/IssueSeverity" }
        quote: { type: string }
        problem: { type: string }
        suggested_fix: { type: string }
        start: { type: integer, description: Byte offset of the quote in the chapter Markdown }
        end: { type: integer }
        quote_exact: { type: boolean, description: False when the quote matched only after normalising punctuation }

    BibleConflict:
      type: object
      required: [quote, conflicts_with, start, end]
      properties:
        quote: { type: string }
        conflicts_with: { type: string }
        start: { type: integer }
        end: { type: integer }

    Critique:
      type: object
      required: [writer, overall, issues, bible_conflicts]
      properties:
        writer: { type: string }
        overall: { type: string }
        issues:
          type: array
          items: { $ref: "#/components/schemas/CritiqueIssue" }
        bible_conflicts:
          type: array
          items: { $ref: "#/components/schemas/BibleConflict" }
        warnings:
          type: array
          items: { type: string }

    CritiqueStatus:
      type: string
      enum: [running, succeeded, failed, cancelled]

    CritiqueRecord:
      type: object
      description: One critic's part of a critique run.
      required: [id, run_id, writer_name, writer_slug, model_alias, status, raw_text, error, scene_count, prompt_tokens, completion_tokens, cost_usd, cost_estimated, created_at]
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        chapter_id: { type: string, format: uuid }
        writer_id: { type: string, format: uuid }
        writer_name: { type: string }
        writer_slug: { type: string }
        model_alias: { type: string }
        status: { $ref: "#/components/schemas/CritiqueStatus" }
        critique: { $ref: "#/components/schemas/Critique" }
        raw_text: { type: string }
        error: { type: string }
        scene_count: { type: integer }
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        cost_usd: { type: number, format: double }
        cost_estimated: { type: boolean }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }

    IssueDecision:
      type: string
      enum: [pending, accepted, rejected]

    IssueSource:
      type: object
      description: A critic's note that an issue merges or restates.
      required: [id, critique_id, writer_id, writer_name, writer_slug, issue_id]
      properties:
        id: { type: string, description: "<writer slug>/<issue id>" }
        critique_id: { type: string, format: uuid }
        writer_id: { type: string, format: uuid }
        writer_name: { type: string }
        writer_slug: { type: string }
        issue_id: { type: string }

    Issue:
      type: object
      description: One entry of the editor-in-chief's prioritized list, with the author's decision.
      required: [id, run_id, position, key, severity, quote, problem, suggested_fix, start, end, quote_exact, sources, decision, content_hash, created_at]
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        chapter_id: { type: string, format: uuid }
        position: { type: integer }
        key: { type: string, description: The editor's own id, e.g. e1 }
        severity: { $ref: "#/components/schemas/IssueSeverity" }
        quote: { type: string }
        problem: { type: string }
        suggested_fix: { type: string }
        start: { type: integer }
        end: { type: integer }
        quote_exact: { type: boolean }
        sources:
          type: array
          items: { $ref: "#/components/schemas/IssueSource" }
        decision: { $ref: "#/components/schemas/IssueDecision" }
        edited_fix: { type: string, description: The author's own wording of the fix, when edited }
        decided_at: { type: string, format: date-time }
        content_hash: { type: string, description: Hash of the chapter text the critique read }
        created_at: { type: string, format: date-time }

    IssueDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { $ref: "#/components/schemas/IssueDecision" }
        edited_fix:
          type: string
          nullable: true
          maxLength: 5000
          description: The author's own wording of the fix. Omitted keeps the current value; null or empty clears it.

    RevisionStatus:
      type: string
      enum: [proposed, applied, discarded]

    DiffOp:
      type: object
      required: [kind, text]
      properties:
        kind: { type: string, enum: [equal, insert, delete] }
        text: { type: string }

    DiffHunk:
      type: object
      description: One region of change; offsets address the chapter text the revision was computed against.
      required: [index, old_start, old_end, old_text, new_text, ops, context_before, context_after]
      properties:
        index: { type: integer }
        old_start: { type: integer }
        old_end: { type: integer }
        old_text: { type: string }
        new_text: { type: string }
        ops:
          type: array
          items: { $ref: "#/components/schemas/DiffOp" }
        context_before: { type: string }
        context_after: { type: string }

    DiffStats:
      type: object
      required: [words_added, words_removed, hunks]
      properties:
        words_added: { type: integer }
        words_removed: { type: integer }
        hunks: { type: integer }

    SkippedIssue:
      type: object
      required: [issue_id, key, quote, reason]
      properties:
        issue_id: { type: string, format: uuid }
        key: { type: string }
        quote: { type: string }
        reason: { type: string }

    Revision:
      type: object
      description: A revised text proposed by the lead writer, as word-level hunks over the chapter.
      required: [id, run_id, chapter_id, status, stale, base_hash, revised_md, hunks, stats, issue_ids, skipped, result_hash, created_at]
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        chapter_id: { type: string, format: uuid }
        critique_run_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/RevisionStatus" }
        stale: { type: boolean, description: True when the chapter changed since the revision was proposed; it can no longer be applied }
        base_hash: { type: string }
        revised_md: { type: string }
        hunks:
          type: array
          items: { $ref: "#/components/schemas/DiffHunk" }
        stats: { $ref: "#/components/schemas/DiffStats" }
        issue_ids:
          type: array
          items: { type: string, format: uuid }
        skipped:
          type: array
          items: { $ref: "#/components/schemas/SkippedIssue" }
        applied_hunks:
          type: array
          items: { type: integer }
        result_hash: { type: string }
        created_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }

    RevisionStartInput:
      type: object
      required: [run_id]
      properties:
        run_id: { type: string, format: uuid, description: The critique run whose accepted issues to apply }

    RevisionApplyInput:
      type: object
      properties:
        hunk_indexes:
          type: array
          description: Hunks to apply; omitted means every hunk.
          items: { type: integer }

    RevisionApplyResult:
      type: object
      required: [chapter, revision]
      properties:
        chapter: { $ref: "#/components/schemas/Chapter" }
        revision: { $ref: "#/components/schemas/Revision" }
        bible_run_id: { type: string, format: uuid, description: The bible update run started by the apply, when one was }

    ProposalAction:
      type: string
      enum: [add, update, delete]

    ProposalStatus:
      type: string
      enum: [pending, approved, rejected]

    BibleProposal:
      type: object
      description: A change to the story bible proposed by the bible keeper, waiting for or carrying the author's decision.
      required: [id, run_id, project_id, action, section, title, fields, rationale, status, position, created_at]
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        chapter_id: { type: string, format: uuid }
        revision_id: { type: string, format: uuid }
        action: { $ref: "#/components/schemas/ProposalAction" }
        entry_id: { type: string, format: uuid, description: The entry to update or delete }
        current: { $ref: "#/components/schemas/BibleEntry" }
        section: { $ref: "#/components/schemas/BibleSection" }
        title: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
        rationale: { type: string }
        status: { $ref: "#/components/schemas/ProposalStatus" }
        applied_entry_id: { type: string, format: uuid }
        position: { type: integer }
        created_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }

    BibleProposalDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approved, rejected] }
        title: { type: string, maxLength: 300 }
        fields:
          type: object
          additionalProperties: { type: string }

    BibleUpdateStartInput:
      type: object
      properties:
        revision_id: { type: string, format: uuid, description: The applied revision whose changes the keeper should consider }

    DraftMode:
      type: string
      enum: [selection, continue]

    DraftDecision:
      type: string
      enum: [pending, inserted, replaced, discarded]

    DraftStatus:
      type: string
      enum: [running, succeeded, failed, cancelled]

    Draft:
      type: object
      description: One co-writer's draft for a request, with what the author did with it.
      required: [id, run_id, writer_name, writer_slug, model_alias, mode, instruction, selection, notes, status, text, error, decision, position, prompt_tokens, completion_tokens, cost_usd, cost_estimated, created_at]
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        chapter_id: { type: string, format: uuid }
        writer_id: { type: string, format: uuid }
        writer_name: { type: string }
        writer_slug: { type: string }
        model_alias: { type: string }
        mode: { $ref: "#/components/schemas/DraftMode" }
        instruction: { type: string }
        selection: { type: string, description: The passage the draft was asked to replace, when any }
        notes: { type: string }
        status: { $ref: "#/components/schemas/DraftStatus" }
        text: { type: string, description: The draft, in Markdown }
        error: { type: string }
        decision: { $ref: "#/components/schemas/DraftDecision" }
        decided_at: { type: string, format: date-time }
        position: { type: integer }
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        cost_usd: { type: number, format: double }
        cost_estimated: { type: boolean }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }

    CowriteStartInput:
      type: object
      required: [writer_ids, instruction]
      properties:
        writer_ids:
          type: array
          minItems: 1
          maxItems: 3
          items: { type: string, format: uuid }
          description: One writer co-writes; two or three compare.
        instruction: { type: string, minLength: 1, maxLength: 2000 }
        selection: { type: string, maxLength: 60000, description: The selected passage; omit to continue from the cursor }
        notes: { type: string, maxLength: 4000, description: Scene notes, optional }
        context_before: { type: string, maxLength: 20000, description: Text just before the cursor or selection }
        context_after: { type: string, maxLength: 20000, description: Text just after }

    DraftDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { $ref: "#/components/schemas/DraftDecision" }

    HistoryTotals:
      type: object
      required: [runs, cost_usd, cost_estimated, prompt_tokens, completion_tokens]
      properties:
        runs: { type: integer }
        cost_usd: { type: number, format: double }
        cost_estimated: { type: boolean, description: True when any part of the cost was estimated from token counts }
        prompt_tokens: { type: integer, format: int64 }
        completion_tokens: { type: integer, format: int64 }

    HistoryKindCount:
      type: object
      required: [kind, count]
      properties:
        kind: { $ref: "#/components/schemas/RunKind" }
        count: { type: integer }

    CritiqueSummary:
      type: object
      required: [critics, failed, issues, accepted, rejected, pending, synthesis]
      properties:
        critics: { type: integer }
        failed: { type: integer }
        issues: { type: integer }
        accepted: { type: integer }
        rejected: { type: integer }
        pending: { type: integer }
        synthesis: { type: string, description: ok, fallback or skipped }

    RevisionSummary:
      type: object
      required: [status, hunks, applied_hunks, words_added, words_removed]
      properties:
        status: { $ref: "#/components/schemas/RevisionStatus" }
        hunks: { type: integer }
        applied_hunks: { type: integer }
        words_added: { type: integer }
        words_removed: { type: integer }

    DraftsSummary:
      type: object
      required: [count, inserted, replaced, discarded, pending]
      properties:
        count: { type: integer }
        inserted: { type: integer }
        replaced: { type: integer }
        discarded: { type: integer }
        pending: { type: integer }

    BibleSummary:
      type: object
      required: [proposals, approved, rejected, pending]
      properties:
        proposals: { type: integer }
        approved: { type: integer }
        rejected: { type: integer }
        pending: { type: integer }

    RunHistoryItem:
      type: object
      required: [run, summary, writers, model_calls]
      properties:
        run: { $ref: "#/components/schemas/Run" }
        summary: { type: string, description: One line saying what the run did and what came of it }
        writers:
          type: array
          items: { type: string }
        model_calls: { type: integer }
        critique: { $ref: "#/components/schemas/CritiqueSummary" }
        revision: { $ref: "#/components/schemas/RevisionSummary" }
        drafts: { $ref: "#/components/schemas/DraftsSummary" }
        bible: { $ref: "#/components/schemas/BibleSummary" }

    HistoryPage:
      type: object
      required: [items, totals, kinds]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RunHistoryItem" }
        totals: { $ref: "#/components/schemas/HistoryTotals" }
        kinds:
          type: array
          items: { $ref: "#/components/schemas/HistoryKindCount" }
        next_before: { type: string, format: date-time, description: Pass as `before` to get the next page; absent on the last page }

    ModelCall:
      type: object
      description: One request to the gateway, as recorded.
      required: [id, generation_name, model_alias, prompt_tokens, completion_tokens, cost_usd, cost_estimated, latency_ms, status, error, created_at]
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        writer_id: { type: string, format: uuid }
        writer_name: { type: string }
        generation_name: { type: string }
        model_alias: { type: string }
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        cost_usd: { type: number, format: double }
        cost_estimated: { type: boolean }
        latency_ms: { type: integer }
        status: { type: string, enum: [ok, error] }
        error: { type: string }
        created_at: { type: string, format: date-time }

    KindCost:
      type: object
      required: [kind, calls, cost_usd, cost_estimated, prompt_tokens, completion_tokens]
      properties:
        kind: { type: string, description: A run kind, or "other" for calls outside a run }
        calls: { type: integer }
        cost_usd: { type: number, format: double }
        cost_estimated: { type: boolean }
        prompt_tokens: { type: integer, format: int64 }
        completion_tokens: { type: integer, format: int64 }

    IssueStats:
      type: object
      required: [listed, accepted, rejected, pending]
      properties:
        listed: { type: integer, description: Issues on the editor-in-chief's list that cite this writer }
        accepted: { type: integer }
        rejected: { type: integer }
        pending: { type: integer }
        acceptance_rate: { type: number, format: double, description: accepted / (accepted + rejected); absent until something was decided }

    DraftStats:
      type: object
      required: [count, used, discarded, pending]
      properties:
        count: { type: integer, description: Drafts the writer finished }
        used: { type: integer, description: Inserted or replaced }
        discarded: { type: integer }
        pending: { type: integer }
        acceptance_rate: { type: number, format: double, description: used / (used + discarded); absent until something was decided }

    WriterStats:
      type: object
      required: [writer_id, name, slug, model_alias, enabled, is_system, roles, critiques, issues, drafts, calls, cost_usd, cost_estimated, prompt_tokens, completion_tokens, by_kind]
      properties:
        writer_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        model_alias: { type: string }
        enabled: { type: boolean }
        is_system: { type: boolean }
        roles:
          type: array
          items: { $ref: "#/components/schemas/WriterRole" }
        critiques: { type: integer, description: Critiques the writer finished }
        issues: { $ref: "#/components/schemas/IssueStats" }
        drafts: { $ref: "#/components/schemas/DraftStats" }
        calls: { type: integer }
        cost_usd: { type: number, format: double }
        cost_estimated: { type: boolean }
        prompt_tokens: { type: integer, format: int64 }
        completion_tokens: { type: integer, format: int64 }
        by_kind:
          type: array
          items: { $ref: "#/components/schemas/KindCost" }

    WriterStatsPage:
      type: object
      required: [period, writers, totals]
      properties:
        period: { type: string }
        project_id: { type: string, format: uuid }
        writers:
          type: array
          items: { $ref: "#/components/schemas/WriterStats" }
        totals: { $ref: "#/components/schemas/KindCost", description: Everything in the period and project, including calls of writers since deleted }

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 64 }
        password: { type: string, maxLength: 256 }

    UserCreateInput:
      type: object
      required: [username, password, role]
      properties:
        username: { type: string, minLength: 3, maxLength: 32 }
        display_name: { type: string, maxLength: 120 }
        password: { type: string, minLength: 8, maxLength: 72 }
        role: { type: string, enum: [admin, author] }

    AccountInput:
      type: object
      required: [display_name]
      properties:
        display_name: { type: string, maxLength: 120 }

    PasswordChangeInput:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, maxLength: 256 }
        new_password: { type: string, minLength: 8, maxLength: 72 }

    UsageNumbers:
      type: object
      required: [projects, chapters, runs, model_calls, prompt_tokens, completion_tokens, cost_usd, cost_estimated]
      properties:
        projects: { type: integer }
        chapters: { type: integer }
        runs: { type: integer }
        model_calls: { type: integer }
        prompt_tokens: { type: integer, format: int64 }
        completion_tokens: { type: integer, format: int64 }
        cost_usd: { type: number, format: double }
        cost_estimated: { type: boolean }

    AccountUsage:
      type: object
      required: [user, usage]
      properties:
        user: { $ref: "#/components/schemas/User" }
        usage: { $ref: "#/components/schemas/UsageNumbers" }
        last_run_at: { type: string, format: date-time }

    UsagePage:
      type: object
      required: [period, accounts, totals]
      properties:
        period: { type: string }
        accounts:
          type: array
          items: { $ref: "#/components/schemas/AccountUsage" }
        totals: { $ref: "#/components/schemas/UsageNumbers" }

    UserUpdateInput:
      type: object
      properties:
        display_name: { type: string, maxLength: 120 }
        role: { type: string, enum: [admin, author] }

    UserPasswordInput:
      type: object
      required: [new_password]
      properties:
        new_password: { type: string, minLength: 8, maxLength: 72 }

    UserDeleteInput:
      type: object
      required: [username]
      properties:
        username: { type: string, description: Must repeat the account's username }
